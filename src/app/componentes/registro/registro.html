<div style="max-width: 400px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Registro de Usuario</h2>
  <form [formGroup]="formRegistro" (ngSubmit)="onSubmit()">
    
    <div>
      <label>Email:</label>
      <input type="email" formControlName="email" style="width: 100%; margin-bottom: 10px;">
    </div>

    <div>
      <label>Contraseña:</label>
      <input type="password" formControlName="password" style="width: 100%; margin-bottom: 10px;">
    </div>

    <div>
      <label>Nombre:</label>
      <input type="text" formControlName="nombre" style="width: 100%; margin-bottom: 10px;">
    </div>

    <div>
      <label>Apellido:</label>
      <input type="text" formControlName="apellido" style="width: 100%; margin-bottom: 10px;">
    </div>

    <div>
      <label>Fecha de Nacimiento:</label>
      <input type="date" formControlName="fecha_nacimiento" style="width: 100%; margin-bottom: 10px;">
    </div>

    <div>
      <label>Tipo de Sangre:</label>
      <select formControlName="tipo_sangre" style="width: 100%; margin-bottom: 10px;">
        <option value="">Seleccionar</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
      </select>
    </div>

    <div>
      <label>Color de Ojos:</label>
      <input type="text" formControlName="color_ojos" style="width: 100%; margin-bottom: 10px;">
    </div>

    <div>
      <label>Días de Vacaciones por año:</label>
      <input type="number" formControlName="dias_vacaciones" style="width: 100%; margin-bottom: 10px;">
    </div>

    <button type="submit" [disabled]="formRegistro.invalid" style="width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px;">
      Registrarse
    </button>
  </form>

  <p *ngIf="mensaje" style="margin-top: 10px; font-weight: bold;">{{ mensaje }}</p>
</div>
