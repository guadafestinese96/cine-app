<div
  style="
    max-width: 400px;
    margin: 40px auto;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
  "
>
  <h2>Iniciar Sesión</h2>

  <form
    [formGroup]="formLogin"
    (ngSubmit)="onSubmit()"
    style="padding: 10px;"
  >
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px;">Email:</label>
      <input
        type="email"
        formControlName="email"
        style="width: 100%; padding: 8px; box-sizing: border-box;"
      />
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px;">Contraseña:</label>
      <input
        type="password"
        formControlName="password"
        style="width: 100%; padding: 8px; box-sizing: border-box;"
      />
    </div>

    <div>
      <button
        type="submit"
        [disabled]="formLogin.invalid"
        style="
          width: 100%;
          padding: 10px;
          background: #28a745;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          margin-bottom: 8px;
          box-sizing: border-box;
        "
      >
        Ingresar
      </button>

      <button
        type="button"
        (click)="irARegistro()"
        style="
          width: 100%;
          padding: 10px;
          background: #007bff;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          box-sizing: border-box;
        "
      >
        Registrarse
      </button>
    </div>
  </form>

  <p *ngIf="mensaje" style="margin-top: 15px; font-weight: bold;">{{ mensaje }}</p>
</div>
