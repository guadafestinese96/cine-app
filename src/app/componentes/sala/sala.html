<div class="sala-container">
  <div class="pantalla-caja">
    <div class="pantalla">PANTALLA</div>
  </div>

  <!-- Leyenda de colores -->
  <div class="leyenda">
    <div class="item-leyenda"><span class="box libre"></span> Libre</div>
    <div class="item-leyenda"><span class="box seleccionada"></span> Tu Selección</div>
    <div class="item-leyenda"><span class="box adaptada"></span> Discapacidad (J, K)</div>
    <div class="item-leyenda"><span class="box vip"></span> VIP (R, S, T)</div>
    <div class="item-leyenda"><span class="box ocupada"></span> Ocupada</div>
  </div>

  <!-- Mapa de Filas y Butacas -->
  <div class="mapa-sala">
    <div *ngFor="let fila of filasEstructuradas" class="fila-container">
      <span class="letra-fila">{{ fila.letra }}</span>

      <!-- Bloque Izquierdo -->
      <div class="bloque-izquierdo">
        <div 
          *ngFor="let b of fila.izquierdo" 
          class="butaca"
          [ngClass]="{
            'adaptada': b.tipo === 'adaptada',
            'vip': b.tipo === 'vip',
            'seleccionada': b.seleccionada,
            'ocupada': b.ocupada
          }"
          (click)="toggleSeleccion(b)">
          {{ b.numero }}
        </div>
      </div>

      <!-- Pasillo Izquierdo -->
      <div class="pasillo"></div>

      <!-- Bloque Centro -->
      <div class="bloque-centro">
        <div 
          *ngFor="let b of fila.centro" 
          class="butaca"
          [ngClass]="{
            'adaptada': b.tipo === 'adaptada',
            'vip': b.tipo === 'vip',
            'seleccionada': b.seleccionada,
            'ocupada': b.ocupada
          }"
          (click)="toggleSeleccion(b)">
          {{ b.numero }}
        </div>
      </div>

      <!-- Pasillo Derecho -->
      <div class="pasillo"></div>

      <!-- Bloque Derecho -->
      <div class="bloque-derecho">
        <div 
          *ngFor="let b of fila.derecho" 
          class="butaca"
          [ngClass]="{
            'adaptada': b.tipo === 'adaptada',
            'vip': b.tipo === 'vip',
            'seleccionada': b.seleccionada,
            'ocupada': b.ocupada
          }"
          (click)="toggleSeleccion(b)">
          {{ b.numero }}
        </div>
      </div>

      <span class="letra-fila">{{ fila.letra }}</span>
    </div>
  </div>

  <!-- Resumen inferior -->
  <div class="resumen-panel" *ngIf="butacasSeleccionadas.length > 0">
    <p>Butacas seleccionadas: 
      <strong *ngFor="let b of butacasSeleccionadas; let last = last">
        {{ b.fila }}{{ b.numero }} ({{ b.tipo | uppercase }}){{ last ? '' : ', ' }}
      </strong>
    </p>
    <p class="total">Total: <span>${{ totalPagar }}</span></p>

    <div *ngIf="mensajeErrorEdad" class="error-edad">
      {{ mensajeErrorEdad }}
    </div>

    <button class="btn-confirmar" (click)="confirmarReserva()" [disabled]="!!mensajeErrorEdad">
      Continuar al Candy Bar 🍿
    </button>
  </div>
</div>
