<div class="contenedor pagina">
  <h1>Administración</h1>
  <div class="pestanas" role="tablist" aria-label="Secciones del panel">
    @for (s of secciones; track s.id) {
      <button role="tab" [attr.aria-selected]="activa() === s.id" (click)="ir(s.id)">{{ s.nombre }}</button>
    }
  </div>
  @switch (activa()) {
    @case ('reportes') { <app-admin-reportes /> }
    @case ('peliculas') { <app-admin-peliculas /> }
    @case ('funciones') { <app-admin-funciones /> }
    @case ('salas') { <app-admin-salas /> }
    @case ('candy') { <app-admin-candy /> }
    @case ('beneficios') { <app-admin-beneficios /> }
    @case ('usuarios') { <app-admin-usuarios /> }
    @case ('actividad') { <app-admin-actividad /> }
  }
</div>
